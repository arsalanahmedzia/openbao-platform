# Application layers, applied after the infrastructure layers (dependsOn).
#   apps-database: HA PostgreSQL (CloudNativePG) for OpenBao, with backups to
#   the in-cluster S3 bucket pg-backups. Needs infra-storage (bucket) first.
#   apps-openbao: OpenBao HA (3 pods) on pg-openbao, HTTPS through Traefik.
#   Pods start sealed; init/unseal are done by scripts, not by Flux (ADR 0004).
#   apps-external-secrets: ClusterSecretStore "openbao" and the External Secrets
#   demo in namespace eso-demo (ADR 0005). Not Ready while OpenBao is sealed.
#   apps-monitoring: Prometheus, Alertmanager, operator, kube-state-metrics in
#   namespace monitoring (kube-prometheus-stack, most parts off).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-database
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-storage
  interval: 10m
  retryInterval: 1m
  # Three nodes pull the PostgreSQL image (~1.1 GB) and two replicas clone the
  # primary before the Cluster is Ready.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/database
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: apps-database
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/openbao
  prune: true
  # Waits only for the objects in apps/openbao (HelmRelease, Certificate, ...),
  # not for the OpenBao pods, which stay unready until they are unsealed.
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-external-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: apps-openbao
    - name: infra-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/external-secrets
  prune: true
  # Waits until the ClusterSecretStore reports Ready (logged in to OpenBao)
  # and the ExternalSecrets have synced. No secrets in this folder: no SOPS.
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-monitoring
  namespace: flux-system
spec:
  # Needs the chart repository (infra-controllers) and the ClusterIssuer
  # demo-ca (infra-configs) for certificate.yaml. The ServiceMonitors,
  # PodMonitors and PrometheusRules for the other namespaces live in
  # apps/monitoring/ too, so no other layer depends on the new CRDs.
  dependsOn:
    - name: infra-controllers
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  # First install: CRDs and four new images.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/monitoring
  prune: true
  wait: true
