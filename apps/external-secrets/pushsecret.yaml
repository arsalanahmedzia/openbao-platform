# Push: Kubernetes -> OpenBao. ESO copies key "message" of the Secret
# eso-demo/push-demo to secret/pushed/push-demo (field "message").
# API version external-secrets.io/v1alpha1 (CRDs of chart 2.14.0). See ADR 0005.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-demo
  namespace: eso-demo
spec:
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: push-demo
  refreshInterval: 30s
  # Kubernetes is the source of truth: a changed value overwrites OpenBao
  # (IfNotExists would write once and never update).
  updatePolicy: Replace
  # Removing this PushSecret (Flux prune) deletes secret/pushed/push-demo with
  # all versions. ESO only touches values marked managed-by=external-secrets.
  deletionPolicy: Delete
  data:
    - match:
        secretKey: message
        remoteRef:
          remoteKey: pushed/push-demo
          property: message
