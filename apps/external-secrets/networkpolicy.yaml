# Incoming traffic to namespace eso-demo (hardening B2, risk R10, ADR 0006).
# The only pod here is hello-consumer (deployment-hello-consumer.yaml). It
# reads the synced Secret as a mounted file and accepts no connections, so it
# needs no allow rule. ESO writes the Secrets through the Kubernetes API, not
# into pods here. Default deny so any pod added later starts closed and needs
# an explicit rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: eso-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
