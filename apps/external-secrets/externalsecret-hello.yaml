# Pull: OpenBao -> Kubernetes. ESO reads secret/demo/hello (field "message")
# every 30 s and writes it to the Secret eso-demo/hello-from-openbao.
# API version external-secrets.io/v1 (CRDs of chart 2.14.0). See ADR 0005.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello
  namespace: eso-demo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  # Short for the demo, so a change in OpenBao is visible within 30 s.
  refreshInterval: 30s
  refreshPolicy: Periodic
  target:
    name: hello-from-openbao
    # ESO creates the Secret and owns it: removing this ExternalSecret (Flux
    # prune) removes the Secret too.
    creationPolicy: Owner
    # If the value disappears from OpenBao, keep the last Secret rather than
    # breaking the apps that use it.
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: demo/hello
        property: message
