# One store for the cluster: how External Secrets reaches OpenBao (ADR 0005).
# API version external-secrets.io/v1, checked in the CRDs of chart 2.14.0.
#
# - HTTPS to the Service that always points at the active OpenBao pod; the name
#   is in the listener certificate (apps/openbao/server-certificate.yaml).
# - Trust only the demo CA: ca.crt from the Secret openbao/openbao-server-tls,
#   read at runtime (a rebuilt cluster gets a new CA, so it is not copied to Git).
# - Login with Kubernetes auth: ESO requests a 10-minute token for the service
#   account external-secrets/external-secrets and logs in with role
#   external-secrets (policies eso-read, eso-write). No root or static token.
#   serviceAccountRef.namespace must be set for a ClusterSecretStore, otherwise
#   ESO uses each ExternalSecret's namespace and cannot validate the store.
# - Only ExternalSecrets/PushSecrets in namespace eso-demo may use it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - eso-demo
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        key: ca.crt
        namespace: openbao
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
