# Incoming traffic to namespace databases (hardening B2, risk R10, ADR 0006).
# Default: nothing may connect to any pod here. Then:
#   5432 (PostgreSQL) to the pg-openbao pods only from
#     - OpenBao pods (namespace openbao AND label app.kubernetes.io/name=openbao)
#     - the other pg-openbao instances and their Jobs (replication, pg_basebackup)
#   8000 (instance manager status API, HTTPS) to the pg-openbao pods only from
#     - namespace cnpg-system (CloudNativePG operator: status, backups; the
#       Barman Cloud plugin runs there too)
#     - the other pg-openbao instances (failsafe / primary isolation check)
#     - the kind node network 172.18.0.0/16: the kube-apiserver's pods/proxy
#       used by `kubectl cnpg status` comes from the control-plane node
# Ports from CloudNativePG 1.30 (pkg/management/url: StatusPort 8000; 9187
# metrics stays closed, nothing scrapes it). Kubelet probes still work:
# kube-network-policies always accepts traffic generated by root on the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: databases
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-openbao
  policyTypes:
    - Ingress
  ingress:
    - from:
        # one entry with both selectors = namespace openbao AND OpenBao pods
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg-openbao
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-instance-manager
  namespace: databases
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-openbao
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg-openbao
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 8000
