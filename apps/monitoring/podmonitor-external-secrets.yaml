# Scrapes the External Secrets controller on its metrics port (8080 "metrics",
# plain HTTP; chart 2.14.0 templates/deployment.yaml declares it by default,
# so the ESO HelmRelease needs no change). A PodMonitor instead of a
# ServiceMonitor: no extra metrics Service needed. The controller exposes
# externalsecret_/pushsecret_/clustersecretstore_status_condition
# (ESO v2.14.0 docs/api/metrics.md). Webhook and cert-controller not scraped.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - external-secrets
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
