# Scrapes the External Secrets controller on its metrics port (8080 "metrics",
# declared by chart 2.14.0), over HTTPS: certificate from
# infrastructure/configs/external-secrets-metrics-certificate.yaml, verified
# with the demo CA and its name; no insecureSkipVerify. A PodMonitor instead
# of a ServiceMonitor: no extra metrics Service needed. The controller exposes
# externalsecret_/pushsecret_/clustersecretstore_status_condition
# (ESO v2.14.0 docs/api/metrics.md). Webhook and cert-controller not scraped.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - external-secrets
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: prometheus-client-tls
            key: ca.crt
        serverName: external-secrets-metrics.external-secrets.svc
