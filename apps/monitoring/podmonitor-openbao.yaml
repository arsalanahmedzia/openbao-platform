# Scrapes all 3 OpenBao pods (active and standbys) on the metrics listener
# (port 9101, plain HTTP, no token; apps/openbao/helmrelease.yaml).
# Field names checked in the PodMonitor CRD of operator v0.94.1.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openbao
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - openbao
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      component: server
  podMetricsEndpoints:
    - port: metrics
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 30s
