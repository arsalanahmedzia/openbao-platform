# OpenBao in HA mode: 3 server pods (one active, two standby) that keep all
# data in PostgreSQL (Cluster pg-openbao, database openbao). The active pod
# holds a lock row in the table openbao_ha_locks; if it dies, a standby takes
# the lock and becomes active. Value names checked in chart 0.30.4 values.yaml.
#
# Pods start SEALED and must be initialised/unsealed by scripts
# (openbao-init.sh, openbao-unseal.sh). A sealed pod is not Ready, so Helm
# must not wait for Ready pods (disableWait), otherwise the install would
# time out before anyone can unseal. See ADR 0004.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: openbao
      version: "0.30.4"   # app v2.7.1
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  values:
    global:
      # HTTPS on the listener too (ADR 0005): the chart then uses https for
      # BAO_ADDR, the probes and the Service port name (Traefik sees a port
      # named "https" and connects with TLS).
      tlsDisable: false
    # Agent injector not used: External Secrets syncs secrets instead.
    injector:
      enabled: false
    # The UI is served by the server itself (ui = true) through the Ingress;
    # this would only add an extra Service.
    ui:
      enabled: false
    server:
      image:
        registry: quay.io
        repository: openbao/openbao
        tag: "2.7.1"
      # Start all 3 pods at once. The default (OrderedReady) would not create
      # pod 1 before pod 0 is Ready, i.e. unsealed.
      podManagementPolicy: Parallel
      # Chart default: updateStrategyType OnDelete. A changed config only takes
      # effect when a pod is deleted by hand (standbys first, then the active).
      # configAnnotation puts a checksum of the config into the pod template, so
      # every config change creates a new StatefulSet revision and
      # scripts/openbao/openbao-tls-rollout.sh restarts exactly the outdated pods.
      configAnnotation: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Connection string with the password, from the SOPS Secret openbao-db.
      # OpenBao reads BAO_PG_CONNECTION_URL instead of connection_url.
      extraSecretEnvironmentVars:
        - envName: BAO_PG_CONNECTION_URL
          secretName: openbao-db
          secretKey: BAO_PG_CONNECTION_URL
      # Listener certificate (server-certificate.yaml) at /openbao/tls.
      volumes:
        - name: tls
          secret:
            secretName: openbao-server-tls
      volumeMounts:
        - name: tls
          mountPath: /openbao/tls
          readOnly: true
      # The chart sets BAO_ADDR=https://127.0.0.1:8200 but no CA: without this
      # the bao CLI inside the pods (our scripts) would reject the certificate.
      extraEnvironmentVars:
        BAO_CACERT: /openbao/tls/ca.crt
      # Metrics listener (see config below), scraped by the PodMonitor in
      # apps/monitoring/. Not 8202: the chart already uses it (https-rep).
      extraPorts:
        - containerPort: 9101
          name: metrics
      service:
        active:
          annotations:
            # Traefik -> pods: trust the demo CA, check name openbao-active.openbao.svc
            traefik.ingress.kubernetes.io/service.serverstransport: openbao-openbao-backend@kubernetescrd
      # Data lives in PostgreSQL, no volume per pod.
      dataStorage:
        enabled: false
      # server.affinity keeps the chart default: required pod anti-affinity on
      # kubernetes.io/hostname, so at most one OpenBao pod per node.
      ingress:
        enabled: true
        ingressClassName: traefik
        # Route to the Service openbao-active (only the pod labelled active).
        activeService: true
        hosts:
          - host: openbao.demo.local
            paths: []
        tls:
          - secretName: openbao-tls
            hosts:
              - openbao.demo.local
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: false
        config: |
          ui = true

          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/openbao/tls/tls.crt"
            tls_key_file    = "/openbao/tls/tls.key"
            # Metrics only on the listener below, not through Traefik.
            telemetry {
              disallow_metrics = true
            }
          }

          # Metrics listener for Prometheus (ADR 0007): HTTPS with the same
          # certificate as 8200 (Prometheus verifies it against the demo CA,
          # name openbao.openbao.svc), serves only /v1/sys/metrics, no token
          # needed. Only the Prometheus pod may reach it (NetworkPolicy
          # allow-prometheus-metrics).
          listener "tcp" {
            address       = "[::]:9101"
            tls_cert_file = "/openbao/tls/tls.crt"
            tls_key_file  = "/openbao/tls/tls.key"
            telemetry {
              metrics_only                   = true
              unauthenticated_metrics_access = true
            }
          }

          # Keep metrics 30s for the Prometheus format (default 0 = off); no
          # host name prefix in metric names.
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname          = true
          }

          # connection_url is not set here: it comes from BAO_PG_CONNECTION_URL.
          storage "postgresql" {
            ha_enabled = "true"
            table      = "openbao_kv_store"
            ha_table   = "openbao_ha_locks"
          }

          # Labels each pod openbao-active / openbao-sealed / ... so the
          # Service openbao-active always points at the active pod.
          service_registration "kubernetes" {}

          # Audit log (ADR 0006): one JSON line per request and response, every
          # secret value and token replaced by an HMAC-SHA256 hash. Declarative
          # (OpenBao 2.x: enabling audit devices through the API is off by
          # default, unsafe_allow_api_audit_creation = false). Written to stdout,
          # i.e. the pod log. If no audit device can write, OpenBao refuses
          # requests.
          audit "file" "stdout" {
            description = "Audit log to the pod log (stdout)"
            options {
              file_path = "stdout"
            }
          }
