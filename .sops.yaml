# SOPS rules: only files named *.sops.yaml are encrypted, and only their
# data/stringData fields, so metadata stays readable in Git diffs.
# Replace the age recipient with YOUR public key (the "# public key:" line
# printed by `age-keygen`). The private key is never committed.
creation_rules:
  - path_regex: .*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age162kwlzp6kleh6txpqkyxrqv7xwph06rhttxszjm5v4wu0a2l7elqswykja
