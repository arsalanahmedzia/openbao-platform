# Server certificate for the External Secrets controller's metrics endpoint
# (port 8080, HTTPS), signed by the demo CA. Mounted into the controller at
# /etc/tls (infrastructure/controllers/external-secrets.yaml); Prometheus
# verifies it with the demo CA and the name below (PodMonitor in
# apps/monitoring/). Lives here, not next to the HelmRelease, because the
# ClusterIssuer demo-ca and the Certificate CRD are only ready in this layer.
# The controller reloads renewed files itself (controller-runtime certwatcher).
# See ADR 0007.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-secrets-metrics
  namespace: external-secrets
spec:
  secretName: external-secrets-metrics-tls
  dnsNames:
    - external-secrets-metrics.external-secrets.svc
  usages:
    - server auth
  duration: 2160h      # 90 days
  renewBefore: 360h    # renew 15 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: demo-ca
    kind: ClusterIssuer
    group: cert-manager.io
