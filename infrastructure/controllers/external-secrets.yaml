# External Secrets Operator (ESO): syncs secrets between an external store (OpenBao)
# and Kubernetes Secrets. It adds ExternalSecret (pull), PushSecret (push),
# SecretStore and ClusterSecretStore.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"   # pinned by scripts/pin-versions.sh
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    # The controller mounts the metrics certificate, which only infra-configs
    # (after this layer) can create. Waiting for the pods on the first install
    # would block this layer and so infra-configs: deadlock on a fresh
    # bootstrap. The pod starts as soon as the Secret exists.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installCRDs: true
    # Metrics over HTTPS with a demo-CA certificate (ADR 0007). certFile and
    # keyFile must be file NAMES: controller-runtime joins them with certDir,
    # and with the chart defaults (/etc/tls/tls.crt) it would find no file and
    # silently fall back to a self-signed localhost certificate.
    metrics:
      listen:
        secure:
          enabled: true
          certDir: /etc/tls
          certFile: tls.crt
          keyFile: tls.key
    # Controller pod only (webhook and cert-controller have their own lists).
    extraVolumes:
      - name: metrics-tls
        secret:
          secretName: external-secrets-metrics-tls
    extraVolumeMounts:
      - name: metrics-tls
        mountPath: /etc/tls
        readOnly: true
