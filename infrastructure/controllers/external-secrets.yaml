# External Secrets Operator (ESO): syncs secrets between an external store (OpenBao)
# and Kubernetes Secrets. It adds ExternalSecret (pull), PushSecret (push),
# SecretStore and ClusterSecretStore.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"   # pinned by scripts/pin-versions.sh
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installCRDs: true
