# Incoming traffic to namespace external-secrets (hardening B2, risk R10,
# ADR 0006). Default: nothing may connect to any pod here. The ESO controller
# and cert-controller only make outgoing connections (OpenBao, Kubernetes API),
# so they get no allow rule. One exception:
#   10250 (webhook pod port; its Service maps 443 -> 10250) from the kind node
#   network: the kube-apiserver on the control-plane node calls the validating
#   webhooks for SecretStores, ClusterSecretStores and ExternalSecrets with
#   failurePolicy Fail (chart 2.14.0 default), so blocking it would make every
#   create/update of those objects fail (and Flux could not apply them).
#   172.16.0.0/12 = Docker's default network ranges, see
#   apps/database/networkpolicy.yaml.
# Kubelet health probes (8081/8082) still work: kube-network-policies always
# accepts traffic generated by root on the node. Metrics (8080): only the
# controller, only from Prometheus (allow-prometheus-metrics at the end).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-apiserver
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - protocol: TCP
          port: 10250
---
# 8080 (controller metrics, HTTP) to the ESO controller only (not webhook or
# cert-controller) from the Prometheus pod (namespace monitoring AND
# app.kubernetes.io/name=prometheus). Monitoring M3.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
