# Incoming traffic to namespace storage (hardening B2, risk R10, ADR 0006).
# Default: nothing may connect to any pod here. Then exactly two paths to the
# SeaweedFS S3 port 8333:
#   - from namespace databases: the Barman Cloud plugin runs inside every
#     PostgreSQL pod and archives WAL / base backups here (also restores)
#   - from namespace storage itself: the bucket Job (create-bucket-job.yaml)
# Kubelet probes still work: kube-network-policies (kind's policy engine)
# always accepts traffic generated by root on the node itself.
# Enforcement checked in hardening B1 (scripts/hardening/netpol-enforcement-test.sh).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-s3
  namespace: storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        # kubernetes.io/metadata.name is set by Kubernetes on every namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8333
