# SeaweedFS: small S3-compatible object store, one pod, for PostgreSQL backups.
# Single replica on a local-path volume: data lives on one node (see ADR 0002).
# S3 API: http://seaweedfs.storage.svc.cluster.local:8333 (plain HTTP, in-cluster only).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard   # kind default, local-path provisioner
  resources:
    requests:
      storage: 5Gi             # not enforced by local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  replicas: 1
  # Stop the old pod before starting a new one: two SeaweedFS processes must
  # never use the same /data at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          # Only args: the image entrypoint (/entrypoint.sh) fixes /data ownership,
          # drops to user "seaweed" and runs "weed server ...". Flags verified
          # with "weed help server" for this tag. S3 port defaults to 8333.
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        # Only the identities file; the plain key entries are for the bucket Job.
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
